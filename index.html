<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E5A">
<meta name="description" content="Offline infant immunisation visit tracker for one clinic.">
<title>ImmuTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <div id="banner" aria-live="polite"></div>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<noscript><p style="padding:24px;font:16px system-ui">ImmuTrack needs JavaScript turned on.</p></noscript>
<script src="schedule.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
